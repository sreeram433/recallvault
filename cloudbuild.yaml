# GitHub main → Cloud Build → Artifact Registry → Cloud Run
# Trigger: push to main, included files backend/**
substitutions:
  _REGION: us-central1
  _SERVICE: recallvault-api
  _REPOSITORY: recallvault
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "10"
  _SQL_INSTANCE: recallvault-pg
  _VPC_CONNECTOR: recallvault-vpc

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest
      - backend

  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --cpu=1
      - --memory=512Mi
      - --concurrency=40
      - --timeout=30s
      - --allow-unauthenticated
      - --ingress=all
      - --service-account=sa-recallvault-run@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_SQL_INSTANCE}
      - --vpc-connector=${_VPC_CONNECTOR}
      - --vpc-egress=private-ranges-only
      - --set-env-vars=APP_ENV=production,GCP_PROJECT_ID=$PROJECT_ID,INSTANCE_CONNECTION_NAME=$PROJECT_ID:${_REGION}:${_SQL_INSTANCE},DB_USER=recallvault,DB_NAME=recallvault,DB_IP_TYPE=private,JWT_SECRET_RESOURCE=projects/$PROJECT_ID/secrets/JWT_SECRET/versions/latest,DB_PASSWORD_RESOURCE=projects/$PROJECT_ID/secrets/DB_PASSWORD/versions/latest
      - --update-env-vars=GCS_SCREENSHOTS_BUCKET=$PROJECT_ID-recallvault-screenshots

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:latest
